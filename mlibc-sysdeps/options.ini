[binaries]
c = ['clang', '--target=x86_64-unknown-miniOS']
c_ld = 'lld'
cpp = ['clang++', '--target=x86_64-unknown-miniOS']
cpp_ld = 'lld'
ar = 'llvm-ar'
ranlib = 'llvm-ranlib'
strip = 'llvm-strip'

[built-in options]
c_args = ['-D_GNU_SOURCE', '-fPIC', '-D__WINT_TYPE__=unsigned int']
cpp_args = ['-D_GNU_SOURCE', '-fPIC', '-D__WINT_TYPE__=unsigned int']

[host_machine]
system = 'miniOS'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
